# Fly.io config for the aura render service.
# `fly launch --no-deploy` may suffix the app name if it's taken globally —
# whatever ends up in `app` here is the `.fly.dev` host consumers point at.

app = 'aura-render'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Video renders run for minutes; keep the hard limit low so Fly queues or
    # scales instead of piling requests onto one busy machine.
    type = 'requests'
    hard_limit = 6
    soft_limit = 3

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '4gb'
  cpus = 2
  memory_mb = 4096
